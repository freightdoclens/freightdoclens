<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreightLens Interactive Demo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div style="display:flex; align-items:center; gap:12px;">
    <a href="index.html" class="logo">Freight<span>Lens</span></a>
    <span style="font-size:12px; color:var(--muted); border-left:1px solid var(--line); padding-left:12px;">Pexolux Technologies</span>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <a href="mailto:contact@freightdoclens.com" class="link" style="font-size:13px; color:var(--muted);">contact@freightdoclens.com</a>
    <a href="index.html" class="btn ghost" style="padding:7px 14px">← Back to site</a>
  </div>
</div>

<div class="app">
  <aside class="side">
    <h4>Documents</h4>
    <div id="doclist"></div>
    <label class="upload">
      + Upload your own document
      <input id="file" type="file" accept="image/*,.pdf" hidden>
    </label>
  </aside>

  <main class="stage" id="stage">
    <div class="scan"></div>
    <div id="preview"></div>
  </main>

  <aside class="results">
    <div class="banner">Demo mode: results shown are sample data. Live extraction is in development.</div>
    <h4 id="rtitle"></h4>
    <div class="meta" id="rmeta"></div>
    <div class="actions">
      <button class="btn" id="copy">Copy JSON</button>
      <button class="btn ghost" id="csv">Download CSV</button>
    </div>
    <div id="fields"></div>
  </aside>
</div>
<script src="demo.js"></script>
</body>
</html>
